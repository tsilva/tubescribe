<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeScribe · Channels and videos</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="page-heading">
      <div><div class="brand">TubeScribe</div><h1>Channels &amp; videos</h1><p id="archive-summary">Connecting to archive…</p></div>
      <div class="live"><span id="updated">Connecting…</span><button id="refresh">Refresh</button></div>
    </header>
    <div id="error" class="error hidden" role="alert"></div>
    <div class="toolbar"><input id="video-search" type="search" aria-label="Search channels or videos" placeholder="Search channels, video titles, or IDs…"><span id="result-count" class="muted" role="status"></span></div>
    <div id="channels" aria-label="Channels and videos"><p class="empty">Loading channels…</p></div>
    <footer><span>Read-only archive · <span id="root-label"></span></span><span>Updates every 5 seconds</span></footer>
  </main>
  <dialog id="transcript-preview" aria-labelledby="preview-title">
    <div class="dialog-heading"><h2 id="preview-title">Transcript</h2><button id="close-preview" aria-label="Close transcript">×</button></div>
    <div class="preview-actions"><label>Format <select id="preview-format" aria-label="Transcript format"></select></label><a id="preview-download" class="button">Download</a><a id="preview-srt" class="button hidden">View SRT</a></div>
    <div id="preview-content"></div>
  </dialog>
</body>
</html>
