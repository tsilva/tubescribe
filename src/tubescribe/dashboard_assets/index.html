<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeScribe · Your library</title>
  <meta name="description" content="Sign in to browse your TubeScribe library, read transcripts of saved YouTube videos, and revisit their summaries.">
  <meta name="theme-color" content="#21644e">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/brand/site.webmanifest">
  <!-- reader-bootstrap -->
  <link rel="alternate" type="application/json" href="/api/library">
</head>
<body class="library-app">
  <a class="skip-link" href="#feed">Skip to videos</a>
  <header class="app-bar">
    <a class="brand" href="/" aria-label="TubeScribe library"><img class="brand-mark" src="/brand/favicon-32.png" srcset="/brand/header-96.png 3x" width="32" height="32" alt=""><span>TubeScribe</span></a>
    <div id="library-status" class="live" hidden><span id="worker-status" class="visually-hidden" role="status">Connecting…</span><span id="updated"></span><button id="refresh" class="icon-button" aria-label="Refresh library" title="Refresh library"><img src="/icons/arrow-path.svg" loading="lazy" alt=""></button></div>
    <div id="user-button" aria-label="Your account" hidden></div>
  </header>
  <section id="auth-panel" class="auth-panel" aria-label="Sign in"><p id="auth-message" role="status">Connecting securely…</p><div id="sign-in"></div></section>
  <main class="workspace" hidden>
    <nav id="channel-sidebar" class="channel-sidebar" aria-label="Library channels">
      <p class="sidebar-heading">Library</p>
      <div id="library-navigation"></div>
      <p class="sidebar-heading channel-heading">Channels</p>
      <div id="channel-navigation"></div>
    </nav>
    <div class="library-column">
      <header class="page-heading">
        <h1>Your library</h1><p id="archive-summary">Connecting to your library…</p>
      </header>
      <div id="error" class="error hidden" role="alert"></div>
      <div class="toolbar"><div class="search-field"><img src="/icons/magnifying-glass.svg" loading="lazy" alt=""><input id="video-search" type="search" aria-label="Search channels or videos" placeholder="Search your library…"></div><select id="channel-scope" aria-label="Channel scope"><option value="">All channels</option></select><button id="rolling-summary" class="button" aria-pressed="false" disabled>7-day summary</button></div>
      <div class="feed-controls">
        <button id="unprocessed-filter" class="button" aria-pressed="false">Unprocessed</button>
        <div id="processing-controls" hidden>
          <button id="queue-selected" class="button" disabled>Queue selected</button>
          <span id="processing-estimate" role="status"></span>
        </div>
      </div>
      <p id="processing-message" role="status"></p>
      <div class="feed-heading"><span>Latest videos</span><span id="result-count" role="status"></span></div>
      <div id="feed" class="video-feed" tabindex="-1" aria-label="Video feed"></div>
    </div>
    <aside id="reader" class="reader" aria-label="Reading pane" aria-labelledby="reader-title"></aside>
  </main>
</body>
</html>
