[project]
name = "tubescribe-diarization-trial"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyannote-audio>=4,<5",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-newer = "7 days"
constraint-dependencies = ["mistralai!=2.4.6", "guardrails-ai!=0.10.1"]
