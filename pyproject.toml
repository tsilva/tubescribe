[project]
name = "tubescribe"
version = "0.1.0"
description = "A resumable personal YouTube ASR archive"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28",
    "yt-dlp[default]>=2026.2.4",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "clerk-backend-api>=7.0.0",
]

[project.optional-dependencies]
diarization = [
    "torch==2.13.0; sys_platform == 'linux'",
    "transformers==5.18.0",
    "librosa>=0.11",
]
asr = [
    "faster-whisper>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'linux'",
    "av<17",
]
cloud = [
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
]

[project.scripts]
tubescribe = "tubescribe.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = ["mistralai!=2.4.6", "guardrails-ai!=0.10.1"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
rehearsal = [
    "moto[s3,server]>=5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
